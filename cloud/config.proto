syntax = "proto3";

package particle.cloud.config;

import "nanopb.proto";

/**
 * Request the device to generate a new device key.
 */
message PrepareDeviceKeyChangeRequest {
}

/**
 * A response for `PrepareDeviceKeyChangeRequest`.
 */
message PrepareDeviceKeyChangeResponse {
  /**
   * Opaque key ID.
   *
   * The actual key is sent by the device in a separate `FinalizeDeviceKeyChangeRequest`.
   */
  bytes key_id = 1 [(nanopb).max_size = 16];
}

/**
 * Send the new device key to the server.
 */
message FinalizeDeviceKeyChangeRequest {
  /**
   * Opaque key ID.
   */
  bytes key_id = 1 [(nanopb).max_size = 16];
  /**
   * New public key in DER format.
   */
  bytes public_key = 2;
}

/**
 * A response for `FinalizeDeviceKeyChangeRequest`.
 */
message FinalizeDeviceKeyChangeResponse {
}
